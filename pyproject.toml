[project]
name = "self-hosting-spectrum"
version = "0.1.0"
description = "Four Azure model-hosting patterns, one API Management gateway, one client."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Inference + gateway calls (all four options speak OpenAI Chat Completions)
    "openai>=1.60.0",
    "httpx>=0.27.0",

    # Foundry Agent Service - BYOM prompt agents need >=2.0.0
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.19.0",

    # Option 1: Foundry Managed Compute has no ARM type yet -> beta mgmt SDK
    "azure-mgmt-cognitiveservices==15.0.0b2",

    # Preflight / teardown helpers
    "azure-mgmt-resource>=23.1.0",
    "azure-core>=1.32.0",

    # CLI + output
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
shs-client = "shared.client:main"
shs-agent = "shared.agent:main"
shs-benchmark = "shared.benchmark:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
